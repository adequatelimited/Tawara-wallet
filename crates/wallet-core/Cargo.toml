[package]
name = "tawara-wallet-core"
authors = ["Adequate Systems HK Limited"]
description = "Everything in Tawara that touches the wallet library: the worker, its commands and events, lifecycle, secrets and store policy. No interface dependency."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

# No interface dependency: nothing in this crate may name iced or any other
# UI toolkit, so it stays independent of the shells. `tests/policy.rs` checks
# the manifest.

[dependencies]
mochimo-crypto.workspace = true
zeroize.workspace = true
getrandom.workspace = true

[dev-dependencies]
serde_json.workspace = true
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true
toml.workspace = true
