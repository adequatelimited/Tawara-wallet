# cargo-about configuration for THIRD-PARTY-NOTICES.txt, used by ci/notices.sh.
# The notices are the licence texts of the crates in Cargo.lock that the
# desktop application is built from.
#
# Crates are counted with every feature enabled, as in deny.toml's `[graph]`
# table, so a feature added later cannot hide a crate. Build dependencies are
# included because build script output can reach the executable;
# development-only crates are excluded. Mobile targets are not listed.
#
# Every desktop target is listed (x86_64 and aarch64 for Windows MSVC, Linux
# GNU and macOS): a crate built only for an omitted target would ship without
# its licence text.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# The accepted licences are deny.toml's allow list. A crate under any other
# licence is an error. Two per-crate exceptions follow: the Mochimo agreement
# for Tawara's crates and the library, and OFL-1.1 for tawara-app's fonts.
# crates/wallet-core/tests/policy.rs checks this list against deny.toml and the
# exceptions against a fixed table.
# ci/notices.sh runs the generator with `--fail`, so a crate whose licence
# cannot be determined is also an error. A clarification whose file cannot be
# read, or whose checksum does not match, is only a warning; the byte
# comparison in `ci/notices.sh --check` catches the resulting change.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
]

# chrono keeps its MIT and Apache-2.0 texts in one file. The generator's
# `chrono` workaround splits that file, so that each licence has its own text.
workarounds = ["chrono"]

# There is no `[private]` table: its `ignore = true` would drop this
# repository's crates and the library, which are `publish = false`. Each is
# named below with its licence instead.

# The Mochimo agreement has no SPDX identifier; its crates name it
# `LicenseRef-Mochimo-Engine-1.0`, as deny.toml does. cargo-about 0.9.2 does
# not print the text of a `LicenseRef-` licence, so ci/notices.sh appends
# LICENSE.md itself, and the generator's three warnings about these crates are
# expected. Each clarification pins LICENSE.md by SHA-256.

[mochimo-crypto]
accepted = ["LicenseRef-Mochimo-Engine-1.0"]

[mochimo-crypto.clarify]
license = "LicenseRef-Mochimo-Engine-1.0"

