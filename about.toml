# Copyright holders. The MIT, ISC and BSD licences require the copyright notice
# to accompany the software, so each such crate is given the text naming its
# holder wherever the crate publishes one. Where cargo-about finds no licence
# file under a name it recognises, it prints the standard text with a template
# copyright line ("<year> <copyright holders>"). The entries below supply the
# crate's own text:
#
# - `files`: a file the package carries under a name cargo-about does not read,
#   or a different file from the one it would pick;
# - `git`: a file in the crate's repository at the published commit (from the
#   package's `.cargo_vcs_info.json`), fetched from raw.githubusercontent.com on
#   every run. A failed fetch only warns, and `ci/notices.sh --check` then fails.
#
# Every file is pinned by SHA-256. A name covers every version of the crate in
# the graph; a clarification that fails for one version leaves that version to
# its packaged files, with a warning.
#
# Crates that publish their licence without a copyright line are printed as
# published. Fifteen Objective-C crate versions publish no licence text at all;
# they get the standard text with the template line removed by ci/notices.sh,
# and crates/wallet-core/tests/policy.rs lists them. The template names each
# crate's authors from its metadata and says they are not necessarily the
# holders.

# Microsoft's windows crates carry their texts as `license-mit` and
# `license-apache-2.0`, which cargo-about does not read. The MIT one names
# Microsoft Corporation. Every version in the graph has the same two files.

